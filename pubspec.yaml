name: shop
description: FlutterShop is a premium E-commerce UI kit that you can use to build various e-commerce apps using Flutter that works on both Android & iOS. This kit contains 100+ nicely crafted minimal screens that cover everything you need for your shop app.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons:
  change_app_package_name:
  flutter_svg:
  form_field_validator:
  cached_network_image:
  flutter_rating_bar:
  flutter_widget_from_html_core:
  animations:
  url_launcher:

  image_picker:
  http:
  shared_preferences:
  dio:
  crypto:
  mime:
  provider:
  google_generative_ai:
  uuid:
  razorpay_flutter: ^1.3.5
  firebase_auth:
  cloud_firestore:
  permission_handler:
#  flutter_callkit_incoming:
#    git:
#      url: https://github.com/hiennguyen92/flutter_callkit_incoming.git
#      ref: master
  flutter_launcher_icons: ^0.13.1
# This must be at the root level (no indentation)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logom.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/title.png
    - assets/images/logom.png

    - assets/icons/
    - assets/Illustration/
    - assets/flags/
    - assets/logo/
    - assets/screens/

  fonts:
    - family: Plus Jakarta
      fonts:
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Regular.otf
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Bold.otf
          weight: 700
    - family: Grandis Extended
      fonts:
        - asset: assets/fonts/grandis_extended/GrandisExtended-Regular.ttf
        - asset: assets/fonts/grandis_extended/GrandisExtended-Thin.ttf
          weight: 300
        - asset: assets/fonts/grandis_extended/GrandisExtended-Medium.ttf
          weight: 500
        - asset: assets/fonts/grandis_extended/GrandisExtended-Bold.ttf
          weight: 700
        - asset: assets/fonts/grandis_extended/GrandisExtended-Black.ttf
          weight: 900
